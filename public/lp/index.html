<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>漢食｜調べてくれるパートナーにあそんでごちそう</title>
<meta name="description" content="漢字を調べてくれる食いしん坊のパートナーと暮らすアプリ">
<meta name="theme-color" content="#f8f8f8">
<link rel="icon" href="../assets/icons/app.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<link rel="preload" as="image" href="img/story/hand-pc.webp" media="(min-aspect-ratio: 85/100)">
<link rel="preload" as="image" href="img/story/hand-sp.webp" media="(max-aspect-ratio: 85/100)">
<style>
/* ============================================================
   漢食 LP（絵コンテ版）
   はじまりのシーン：封筒に宛名を書こうとして手が止まる
   絵はFigmaの「LP」ページと同じ位置・大きさ（設計の座標で置いて画面に合わせて拡大縮小）
   傾けない 輪郭線を足さない 文字は4の倍数
   ============================================================ */
:root{
  --paper:#f8f8f8;
  --ink:#474338;          /* 絵の線と同じ色 */
  --primary:#38aacf;
  --font:'LINE Seed JP',system-ui,-apple-system,'Hiragino Sans',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- ヘッダー（絵の上に重ねる 帯は敷かない） ---------- */
.top{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;justify-content:space-between;
  height:72px;padding:0 20px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;pointer-events:none}
.top a{pointer-events:auto}
.top__logo{display:block;line-height:0}
.top__logo img{width:64px;height:auto}
.top__start{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 24px;border-radius:24px;
  background:var(--primary);color:#fffed5;font:700 16px/1 var(--font);text-decoration:none;
  box-shadow:0 8px 20px rgba(56,170,207,.32);transition:transform .2s cubic-bezier(.34,1.4,.5,1)}
.top__start:hover{transform:translateY(-4px)}
.top__start:active{transform:translateY(0) scale(.97)}
.top a:focus-visible{outline:4px solid var(--primary);outline-offset:4px;border-radius:12px}
@media (min-width:768px){
  .top{height:96px;padding:0 40px}
  .top__logo img{width:80px}
  .top__start{height:52px;padding:0 32px;font-size:18px}
}

/* ---------- スクロールで進むシーン ---------- */
.story{position:relative;height:900vh;height:900svh}
.story__stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--paper)}
.scene{position:absolute;left:0;top:0;transform-origin:0 0;width:1280px;height:832px}
.scene img{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.scene__bg{left:-260px;top:-97px;width:1875px;height:1460px}
.kraft{position:absolute;opacity:0;pointer-events:none;background:url(img/story/kraft-pc.webp) center/cover no-repeat}
.scene--sp .kraft{background-image:url(img/story/kraft-sp.webp)}
.scene__line{position:absolute;overflow:visible;pointer-events:none}
.scene__line path{fill:none;stroke:var(--ink);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}

.hand{position:absolute;left:0;top:0;will-change:transform}
.hand__shake{position:relative}
.hand__img{left:0;top:0}
.sweat{opacity:0;transform:translateY(-16px);transition:opacity .28s ease,transform .36s cubic-bezier(.3,1.4,.5,1)}
.sweat.is-on{opacity:1;transform:none}

/* ガタガタ震える（位置だけ動かす 傾けない） */
.is-shaking .hand__shake{animation:gata .2s linear infinite}
@keyframes gata{
  0%{transform:translate(0,0)}
  20%{transform:translate(-4px,2px)}
  40%{transform:translate(3px,-2px)}
  60%{transform:translate(-3px,-1px)}
  80%{transform:translate(4px,1px)}
  100%{transform:translate(0,0)}
}

.caption{position:absolute;margin:0;font-weight:700;color:var(--ink);line-height:1.5;letter-spacing:.04em;white-space:nowrap;opacity:0}
.caption--pc{left:168px;top:296px;font-size:36px}
.caption span{display:inline}
/* 「…」はフォントと同じ位置と大きさの丸3つで描く（真ん中の丸に寄るため） */
.caption .ell{position:relative;display:inline-block;width:1em;height:1.1em;vertical-align:-.168em;margin-right:.04em}
.ell i{position:absolute;top:.4655em;width:.172em;height:.172em;border-radius:50%;background:var(--ink)}
.ell i:nth-of-type(1){left:.086em}
.ell i:nth-of-type(2){left:.4135em}
.ell i:nth-of-type(3){left:.741em}

/* 丸の中から顔を出すいぬ（でっかくなった丸と同じ位置に重ねる） */
.peek{position:absolute;z-index:5;border-radius:50%;background:#fff;overflow:hidden;display:none;pointer-events:none}
.peek.is-on{display:block}
.peek img{position:absolute;left:50%;width:64%;height:auto;margin-left:-32%;top:100%;
  transition:transform .56s cubic-bezier(.34,1.56,.64,1)}
.peek.is-up img{transform:translateY(-76%)}
.say{position:absolute;left:0;right:0;top:30%;margin:0;text-align:center;font-weight:700;color:var(--ink);
  font-size:28px;line-height:1.5;letter-spacing:.04em;white-space:nowrap;opacity:0;transform:translate(0,calc(-50% + 8px));
  transition:opacity .32s ease,transform .32s ease;pointer-events:none}
.say.is-on{opacity:1;transform:translate(0,-50%);transition-delay:.24s}

.next{position:absolute;left:calc(50% - 30px);bottom:24px;bottom:calc(24px + env(safe-area-inset-bottom));width:60px;height:60px;border:0;padding:0;border-radius:50%;
  background:#fff;cursor:pointer;display:grid;place-items:center;opacity:.7;transition:opacity .3s ease;
  animation:bob 1.6s ease-in-out infinite}
.next svg{width:36px;height:36px;display:block}
.next:focus-visible{outline:4px solid var(--primary);outline-offset:4px}
.next.is-off{opacity:0;pointer-events:none}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 8px}}

/* スマホの絵（縦長） */
.scene--sp{width:402px;height:874px}
.scene--sp .scene__bg{left:-160px;top:-82px;width:746px;height:1225px}
.scene--sp .scene__line path{stroke-width:16}
.scene--sp .caption{left:24px;top:612px;font-size:28px}
.is-sp .next{bottom:32px;bottom:calc(32px + env(safe-area-inset-bottom))}

@media (prefers-reduced-motion:reduce){
  .top__start{transition:none}
  .is-shaking .hand__shake{animation:none}
  .next{animation:none}
  .sweat{transform:none;transition:opacity .2s linear}
  .peek img{transition:transform .2s ease}
  .say{transform:translate(0,-50%)}
  .say.is-on{transition-delay:0s}
}
</style>
</head>
<body>

<header class="top">
  <a class="top__logo" href="#story" aria-label="ページの先頭へ"><img src="../assets/logo.svg" alt="漢食" width="64" height="55"></a>
  <a class="top__start" href="../">はじめる</a>
</header>

<main>
  <h1 class="sr-only">漢食 調べてくれるパートナーにあそんでごちそう</h1>

  <section class="story" id="story" aria-label="はじまり">
    <div class="story__stage" id="stage">
      <div class="scene" id="scene">
        <img class="scene__bg" id="bg" src="img/story/bg-pc.webp" alt="" width="1875" height="1460">

        <div class="kraft" id="kraft" aria-hidden="true"></div>

        <svg class="scene__line" id="lineSvg" aria-hidden="true">
          <g id="lineG"><path id="linePath" d="M 31.0464 0 C 31.0464 0 1.5975 18.413 0.0464 52.5 C -1.7135 91.1756 47.189 74.9561 43.5464 113.5 C 40.6925 143.699 13.7102 136.1888 12.5465 166.5 C 11.0522 205.4187 56.6899 217.0529 56.5465 256 C 56.4195 290.4589 30.5464 339.5 30.5464 339.5"/></g>
        </svg>

        <div class="hand" id="hand">
          <div class="hand__shake">
            <img class="hand__img" id="handImg" src="img/story/hand-pc.webp" alt="" width="1015" height="1309">
            <img class="sweat" id="sweat1" src="img/story/sweat.webp" alt="">
            <img class="sweat" id="sweat2" src="img/story/sweat.webp" alt="">
          </div>
        </div>

        <p class="caption caption--pc" id="cap1">「学校に書類<br>出さなきゃ！」</p>
        <p class="caption caption--pc" id="cap2"><span class="fade">「</span><span id="are"><span class="are-t">あれ</span><span class="ell"><span class="sr-only">…</span><i></i><i id="dot"></i><i></i></span><span class="are-t">？</span></span><br><span class="fade">「おんちゅう」って<br>どう書くんだっけ？」</span></p>

      </div>

      <div class="peek" id="peek">
        <p class="say" id="say">「御中だよ！」</p>
        <img src="../assets/character/dog-normal.webp" alt="" width="257" height="252">
      </div>

      <button class="next" id="next" type="button" aria-label="つづきを見る">
        <svg viewBox="0 0 36 36" aria-hidden="true"><path fill="#38aacf" transform="translate(9 6)" d="M7.939 23.56L.439 16.06A1.5 1.5 0 0 1 2.56 13.94L7.5 18.879V1.5a1.5 1.5 0 0 1 3 0v17.379l4.939-4.94a1.5 1.5 0 0 1 2.121 2.121l-7.5 7.5a1.5 1.5 0 0 1-2.121 0Z"/></svg>
      </button>
    </div>
  </section>
</main>

<script>
(() => {
  /* 絵の置き場所（Figmaの座標そのまま）
     tip  = 手の画像の中のペン先
     start= はじめの手の位置
     line = 線のパスを置く位置と倍率
     sweat= 手の画像の中の汗の位置と大きさ */
  const PC = {
    w: 1280, h: 832, bleed: 1582,
    bg: 'img/story/bg-pc.webp', hand: 'img/story/hand-pc.webp', handW: 1015, handH: 1309,
    tip: { x: 44, y: 321 },
    start: { x: 644, y: -74 },
    line: { x: 592.95, y: 282.5, k: 1 },
    sweat: [{ x: 558, y: 304, w: 97, h: 116 }, { x: 445, y: 420, w: 97, h: 116 }],
  };
  const SP = {
    w: 402, h: 874, bleed: 560,
    bg: 'img/story/bg-sp.webp', hand: 'img/story/hand-sp.webp', handW: 668, handH: 725,
    tip: { x: 42, y: 248 },
    start: { x: 140.54, y: 20.72 },
    line: { x: 184, y: 330, k: 0.6 },
    sweat: [{ x: 190, y: 192, w: 44, h: 52 }, { x: 136, y: 116, w: 40, h: 48 }],
  };

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const story = $('story'), stage = $('stage'), scene = $('scene');
  const bg = $('bg'), hand = $('hand'), handImg = $('handImg');
  const lineSvg = $('lineSvg'), lineG = $('lineG'), path = $('linePath');
  const sweats = [$('sweat1'), $('sweat2')];
  const cap1 = $('cap1'), cap2 = $('cap2'), next = $('next'), are = $('are');
  const fades = [...cap2.querySelectorAll('.fade')];
  const kraft = $('kraft'), dot = $('dot'), peek = $('peek'), say = $('say');
  const others = [...are.querySelectorAll('.are-t, .ell i:not(#dot)')];
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;

  let cfg = null;
  let base = { x: 0, y: 0, s: 1 };   // 画面に合わせたときの位置と倍率

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const span = (p, a, b) => clamp((p - a) / (b - a));
  const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  function setCfg(c) {
    if (cfg === c) return;
    cfg = c;
    scene.classList.toggle('scene--sp', c === SP);
    stage.classList.toggle('is-sp', c === SP);
    bg.src = c.bg;
    handImg.src = c.hand; handImg.width = c.handW; handImg.height = c.handH;
    handImg.style.width = c.handW + 'px'; handImg.style.height = c.handH + 'px';
    c.sweat.forEach((s, i) => Object.assign(sweats[i].style, { left: s.x + 'px', top: s.y + 'px', width: s.w + 'px', height: s.h + 'px' }));
    const k = c.line.k;
    Object.assign(lineSvg.style, { left: c.line.x + 'px', top: c.line.y + 'px' });
    lineSvg.setAttribute('width', 57 * k); lineSvg.setAttribute('height', 340 * k);
    lineG.setAttribute('transform', `scale(${k})`);
    path.style.strokeWidth = 16;
  }

  function fit() {
    const vw = stage.clientWidth, vh = stage.clientHeight;
    setCfg(vw / vh < 0.85 ? SP : PC);
    let s = vh / cfg.h;
    if (vw / s > cfg.bleed) s = vw / cfg.bleed;          // 横に広すぎる画面は幅に合わせる
    const x = (vw - cfg.w * s) / 2;
    const y = (vh - cfg.h * s) * 0.3;                     // はみ出すときは上を多めに残す
    base = { x, y, s };
    M = null;
    update();
  }

  // 線の上の点（シーンの座標）
  function pointAt(t) {
    const p = path.getPointAtLength(len * t), k = cfg.line.k;
    return { x: cfg.line.x + p.x * k, y: cfg.line.y + p.y * k };
  }

  function progress() {
    const r = story.getBoundingClientRect();
    const total = story.offsetHeight - stage.clientHeight;
    return total > 0 ? clamp(-r.top / total) : 0;
  }

  // 「あれ…？」と真ん中の丸の位置と大きさ（シーンの座標）を測っておく
  let M = null;
  function measure() {
    const keep = scene.style.transform;
    scene.style.transform = 'none';
    const o = scene.getBoundingClientRect();
    const a = are.getBoundingClientRect(), d = dot.getBoundingClientRect();
    scene.style.transform = keep;
    M = {
      are: { x: a.left - o.left + a.width / 2, y: a.top - o.top + a.height / 2, w: a.width, h: a.height },
      dot: { x: d.left - o.left + d.width / 2, y: d.top - o.top + d.height / 2, d: d.width },
    };
  }

  /* 進み方（画面いくつ分スクロールしたか）
     0〜3.1   はじまり→ペンが動く→手が震えて汗が出る
     3.4〜4.7 「あれ…？」に寄っていく まわりの字とうねうねはじわじわ消える
     5.0〜6.6 「…」の真ん中の丸に寄っていく 丸はだんだん白くなる ほかの字は消える
     6.8〜    丸の中からいぬが顔を出して「御中だよ！」 */
  const INK = [0x47, 0x43, 0x38];

  function update() {
    const vw = stage.clientWidth, vh = stage.clientHeight;
    const pAll = progress();
    const u = pAll * (story.offsetHeight - vh) / vh;
    const p = clamp(u / 3.1);
    const begin = pointAt(0);
    const startTip = { x: cfg.start.x + cfg.tip.x, y: cfg.start.y + cfg.tip.y };

    // 1 ペンを紙に下ろす → 2 線をなぞる
    const t1 = ease(span(p, 0.08, 0.2));
    const t2 = span(p, 0.2, 0.64);
    let tip;
    if (t2 <= 0) tip = { x: startTip.x + (begin.x - startTip.x) * t1, y: startTip.y + (begin.y - startTip.y) * t1 };
    else tip = pointAt(t2);
    hand.style.transform = `translate(${tip.x - cfg.tip.x}px,${tip.y - cfg.tip.y}px)`;
    path.style.strokeDashoffset = len * (1 - t2);
    path.style.opacity = t2 > 0 ? 1 - span(u, 3.5, 4.3) : 0;   // 寄っていくときは線も消える

    // ことば
    cap1.style.opacity = 1 - span(p, 0.06, 0.16);
    cap2.style.opacity = span(p, 0.66, 0.74);

    // 3 手が震えて 汗がひとつずつ出る
    scene.classList.toggle('is-shaking', p >= 0.66 && u < 4.8);
    sweats[0].classList.toggle('is-on', p >= 0.74);
    sweats[1].classList.toggle('is-on', p >= 0.86);

    // 4 「あれ…？」に寄る
    if (!M) measure();
    const z1 = ease(span(u, 3.4, 4.7));
    fades.forEach((el) => { el.style.opacity = 1 - span(u, 3.5, 4.3); });   // まわりの字
    const F1 = M.are;
    const S1 = Math.max(base.s, Math.min(vw * (cfg === SP ? 0.7 : 0.56) / F1.w, vh * 0.3 / F1.h));

    // 5 真ん中の丸に寄る
    const z2 = ease(span(u, 5.0, 6.6));
    const D = Math.min(vw * 0.6, vh * 0.36);                // でっかくなった丸の大きさ（まわりに余白を残す）
    const S2 = Math.max(S1, D / M.dot.d);
    others.forEach((el) => { el.style.opacity = 1 - span(u, 5.1, 6.0); });
    const wt = ease(span(u, 5.6, 6.5));
    const dotColor = `rgb(${INK.map((c) => Math.round(c + (255 - c) * wt)).join(',')})`;
    dot.style.background = dotColor;

    let S, tx, ty;
    if (z2 <= 0) {
      S = base.s + (S1 - base.s) * z1;
      const fx = base.x + base.s * F1.x, fy = base.y + base.s * F1.y;
      const px = fx + (vw / 2 - fx) * z1, py = fy + (vh / 2 - fy) * z1;
      tx = px - S * F1.x; ty = py - S * F1.y;
    } else {
      S = S1 * Math.pow(S2 / S1, z2);
      const w = 1 - (1 - z2) * S1 / S;                       // 丸が画面のまんなかへまっすぐ近づくように
      const fx = F1.x + (M.dot.x - F1.x) * w, fy = F1.y + (M.dot.y - F1.y) * w;
      tx = vw / 2 - S * fx; ty = vh / 2 - S * fy;
    }
    scene.style.transform = `translate(${tx}px,${ty}px) scale(${S})`;

    // 寄るにつれて画面いっぱいを封筒の紙にする（紙のふちと白い机を消す）
    Object.assign(kraft.style, { left: -tx / S + 'px', top: -ty / S + 'px', width: vw / S + 'px', height: vh / S + 'px' });
    kraft.style.opacity = span(u, 3.5, 4.5);
    const deep = u > 4.8;                                     // 大きく寄ったら見えない絵は描かない
    bg.style.visibility = hand.style.visibility = lineSvg.style.visibility = deep ? 'hidden' : '';

    // 6 丸が大きくなったら画面の大きさで描いた丸に入れかえる（拡大しすぎると丸がゆがむため）
    const r = M.dot.d * S;
    const swap = z2 > 0 && r > 24;
    if (swap) {
      const cx = tx + S * M.dot.x, cy = ty + S * M.dot.y;
      Object.assign(peek.style, { left: cx - r / 2 + 'px', top: cy - r / 2 + 'px', width: r + 'px', height: r + 'px', background: dotColor });
      say.style.fontSize = Math.max(20, Math.round(r * 0.1 / 4) * 4) + 'px';   // 丸の大きさに合わせる
    }
    dot.style.visibility = swap ? 'hidden' : '';

    // 7 丸の中からいぬが顔を出して「御中だよ！」
    const up = z2 >= 1 && u >= 6.8;
    if (up && !peek.classList.contains('is-on')) { peek.classList.add('is-on'); void peek.offsetWidth; }
    peek.classList.toggle('is-on', swap);
    peek.classList.toggle('is-up', up);
    say.classList.toggle('is-on', up);
  }

  // 下向きボタン：スクロールが3秒止まったらまた出す（いちばん下では出さない）
  const IDLE_MS = 3000;
  let idleTimer = 0;
  const setNext = (on) => next.classList.toggle('is-off', !on);
  next.addEventListener('click', () => {
    scrollBy({ top: innerHeight, behavior: reduce ? 'auto' : 'smooth' });
  });

  let ticking = false;
  addEventListener('scroll', () => {
    setNext(progress() <= 0.02);
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (progress() < 0.995) setNext(true); }, IDLE_MS);
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; update(); });
  }, { passive: true });
  addEventListener('resize', fit);
  if (document.fonts) document.fonts.ready.then(() => { M = null; update(); });
  fit();
})();
</script>
</body>
</html>
