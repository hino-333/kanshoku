<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>漢食｜調べてくれるパートナーにあそんでごちそう</title>
<meta name="description" content="漢字を調べてくれる食いしん坊のパートナーと暮らすアプリ">
<meta name="theme-color" content="#f8f8f8">
<link rel="icon" href="../assets/icons/app.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap">
<link rel="preload" as="image" href="img/story/hand-pc.webp" media="(min-aspect-ratio: 85/100)">
<link rel="preload" as="image" href="img/story/hand-sp.webp" media="(max-aspect-ratio: 85/100)">
<style>
/* ============================================================
   漢食 LP（絵コンテ版）
   はじまりのシーン：封筒に宛名を書こうとして手が止まる
   絵はFigmaの「LP」ページと同じ位置・大きさ（設計の座標で置いて画面に合わせて拡大縮小）
   傾けない 輪郭線を足さない 文字は4の倍数
   ============================================================ */
:root{
  --paper:#f8f8f8;
  --ink:#474338;          /* 絵の線と同じ色 */
  --primary:#38aacf;
  --font:'LINE Seed JP',system-ui,-apple-system,'Hiragino Sans',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- ヘッダー（絵の上に重ねる 帯は敷かない） ---------- */
.top{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;justify-content:space-between;
  height:72px;padding:0 20px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;pointer-events:none}
.top a,.top button{pointer-events:auto}
.top{align-items:flex-start;height:auto;padding-top:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.top__right{display:flex;flex-direction:column;align-items:center;gap:4px}
.top__skip{height:32px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--primary);font:700 14px/1 var(--font);text-shadow:0 0 8px rgba(255,255,255,.9);cursor:pointer;transition:opacity .3s ease}
.top__skip:hover{opacity:.7}
.top__skip.is-off{opacity:0;pointer-events:none}
.top__skip:focus-visible{outline:4px solid var(--primary);outline-offset:2px}
.top__logo{display:block;line-height:0}
.top__logo img{width:64px;height:auto}
.top__start{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 24px;border-radius:24px;
  background:var(--primary);color:#fffed5;font:700 16px/1 var(--font);text-decoration:none;
  box-shadow:0 8px 20px rgba(56,170,207,.32);transition:transform .2s cubic-bezier(.34,1.4,.5,1)}
.top__start:hover{transform:translateY(-4px)}
.top__start:active{transform:translateY(0) scale(.97)}
.top a:focus-visible{outline:4px solid var(--primary);outline-offset:4px;border-radius:12px}
@media (min-width:768px){
  .top{padding:0 40px}
  .top__logo img{width:80px}
  .top__start{height:52px;padding:0 32px;font-size:18px}
  .top{padding-top:20px}
  .top__skip{height:36px;font-size:16px}
}

/* ---------- スクロールで進むシーン ---------- */
.story{position:relative;height:1050vh;height:1050svh}
/* 舞台はスマホの下のバーが引っこんだときの高さ（lvh）まで伸ばして下に白が出ないようにする
   絵の大きさはバーが出ているときの高さ（svh）で決めるので スクロール中に拡大縮小しない */
.story__stage{position:sticky;top:0;height:100vh;height:100lvh;overflow:hidden;background:var(--paper)}
.probe{position:fixed;left:0;top:0;width:0;height:100vh;height:100svh;visibility:hidden;pointer-events:none}
.scene{position:absolute;left:0;top:0;transform-origin:0 0;width:1280px;height:832px}
.scene img{position:absolute;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.scene__bg{left:-260px;top:-97px;width:1875px;height:1460px}
/* 封筒の紙：拡大しない層に置いて いつも画面ぜんぶを覆う（拡大した絵の中に置くと端がずれて白が見えるため） */
.kraft{position:absolute;inset:0;opacity:0;pointer-events:none;background:url(img/story/kraft-pc.webp) center/cover no-repeat}
.is-sp .kraft{background-image:url(img/story/kraft-sp.webp)}
.scene__line{position:absolute;overflow:visible;pointer-events:none}
.scene__line path{fill:none;stroke:var(--ink);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}

.hand{position:absolute;left:0;top:0;will-change:transform}
.hand__shake{position:relative}
.hand__img{left:0;top:0}
.sweat{opacity:0;transform:translateY(-16px);transition:opacity .28s ease,transform .36s cubic-bezier(.3,1.4,.5,1)}
.sweat.is-on{opacity:1;transform:none}

/* ガタガタ震える（位置だけ動かす 傾けない） */
.is-shaking .hand__shake{animation:gata .2s linear infinite}
@keyframes gata{
  0%{transform:translate(0,0)}
  20%{transform:translate(-4px,2px)}
  40%{transform:translate(3px,-2px)}
  60%{transform:translate(-3px,-1px)}
  80%{transform:translate(4px,1px)}
  100%{transform:translate(0,0)}
}

.caption{position:absolute;margin:0;font-weight:700;color:var(--ink);line-height:1.5;letter-spacing:.04em;white-space:nowrap;opacity:0}
.caption--pc{left:168px;top:296px;font-size:36px}
.caption span{display:inline}
/* 「…」はフォントと同じ位置と大きさの丸3つで描く（真ん中の丸に寄るため） */
.caption .ell{position:relative;display:inline-block;width:1em;height:1.1em;vertical-align:-.168em;margin-right:.04em}
.ell i{position:absolute;top:.4655em;width:.172em;height:.172em;border-radius:50%;background:var(--ink)}
.ell i:nth-of-type(1){left:.086em}
.ell i:nth-of-type(2){left:.4135em}
.ell i:nth-of-type(3){left:.741em}
/* 「あれ…？」が画面いっぱいになったら真ん中の丸がぴょんぴょん跳ねる（高さは --hop で0〜1） */
#dot{animation:hop 1.2s infinite}
@keyframes hop{
  0%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
  14%{transform:translateY(calc(var(--hop,0) * -.4em));animation-timing-function:cubic-bezier(.6,0,.8,.4)}
  28%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
  40%{transform:translateY(calc(var(--hop,0) * -.24em));animation-timing-function:cubic-bezier(.6,0,.8,.4)}
  52%,100%{transform:translateY(0)}
}

/* 丸の中から顔を出すいぬ（でっかくなった丸と同じ位置に重ねる） */
.ghost{position:absolute;z-index:5;border-radius:50%;background:var(--ink);display:none;pointer-events:none}
.ghost.is-on{display:block}
.peek{position:absolute;z-index:5;border-radius:50%;background:#fff;overflow:hidden;display:none;pointer-events:none}
.peek.is-on{display:block}
.peek img{position:absolute;left:50%;width:64%;height:auto;margin-left:-32%;top:100%;
  transition:transform .32s cubic-bezier(.6,-.5,.7,.2)}
.peek.is-up img{transform:translateY(-76%);transition:transform .56s cubic-bezier(.34,1.56,.64,1)}
.say{position:absolute;left:0;right:0;top:30%;margin:0;text-align:center;font-weight:700;color:var(--ink);
  font-size:28px;line-height:1.5;letter-spacing:.04em;white-space:nowrap;opacity:0;transform:translate(0,-50%) scale(.4);
  transition:opacity .16s ease .08s,transform .26s cubic-bezier(.6,-.6,.7,.2);pointer-events:none}
.say.is-on{opacity:1;transform:translate(0,-50%);transition:opacity .2s ease .24s,transform .5s cubic-bezier(.34,1.56,.64,1) .24s}

/* ---------- ヒーロー（白い丸が広がってこの画面になる） ---------- */
.hero{position:absolute;inset:0;z-index:7;background:#fff;display:none;overflow:hidden}
.hero.is-on{display:block}
.hero__box{position:absolute;left:0;top:0;width:1280px;height:832px;transform-origin:0 0}
.hero__logo{position:absolute;left:97px;top:158px;width:330px;height:auto}
.hero__phone{position:absolute;left:505px;top:120px;width:270px;height:561px;padding:10px;border-radius:44px;background:#1d1d1f;
  box-shadow:0 24px 48px rgba(29,29,31,.18)}
.hero__screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:rgb(220,242,248)}
.hero__screen img{position:absolute;left:0;top:6%;width:100%;height:auto;display:block}
.hero__island{position:absolute;left:50%;top:12px;width:84px;height:24px;margin-left:-42px;border-radius:12px;background:#1d1d1f}
.hero__dog{position:absolute;left:1000px;top:410px;width:220px;height:auto}
.hero__wave{position:absolute;left:-3000px;top:0;width:7300px;height:3000px;overflow:visible}
.hero__wave path{fill:var(--primary)}
.hero__dl{position:absolute;left:865px;top:236px;width:306px;text-align:center}
.hero__dl-label{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 16px;font-weight:700;font-size:24px;line-height:32px;color:var(--primary)}
.hero__dl-label svg{width:12px;height:28px;flex:none}
.hero__dl-label path{fill:none;stroke:var(--primary);stroke-width:4;stroke-linecap:round}
.hero__badges{display:flex;justify-content:center;align-items:center;gap:12px}
.hero__badges a{display:block;line-height:0;border-radius:8px}
.hero__badges a:focus-visible{outline:4px solid var(--primary);outline-offset:4px}
.hero__badges img{height:48px;width:auto;display:block}

/* スマホのヒーロー */
.is-sp .hero__box{width:390px;height:844px}
.is-sp .hero__logo{left:95px;top:96px;width:200px}
.is-sp .hero__phone{left:40px;top:384px;width:190px;height:395px;padding:7px;border-radius:32px}
.is-sp .hero__screen{border-radius:25px}
.is-sp .hero__island{top:8px;width:58px;height:17px;margin-left:-29px;border-radius:9px}
.is-sp .hero__dog{left:252px;top:540px;width:124px}
.is-sp .hero__dl{left:20px;top:282px;width:350px}
.is-sp .hero__dl-label{font-size:20px;line-height:28px;margin-bottom:12px;gap:8px}
.is-sp .hero__dl-label svg{width:10px;height:24px}
.is-sp .hero__badges{gap:10px}
.is-sp .hero__badges img{height:40px}

/* ポップに出てくる（大きさは縦横そろえて変える 傾けない） */
.hero__logo,.hero__phone,.hero__dl{opacity:0;transform:scale(.5);transition:opacity .2s ease,transform .3s cubic-bezier(.6,-.5,.7,.2)}
.hero__phone{transform:translateY(96px)}
.hero.is-in .hero__logo,.hero.is-in .hero__phone,.hero.is-in .hero__dl{opacity:1;transform:none;transition:opacity .2s ease,transform .6s cubic-bezier(.34,1.56,.64,1)}
.hero.is-in .hero__phone{transition-delay:.08s}
.hero.is-in .hero__dl{transition-delay:.16s}
.hero__dog{transform:translateY(90%);transition:transform .3s cubic-bezier(.6,-.5,.7,.2)}
.hero.is-dog .hero__dog{transform:none;transition:transform .56s cubic-bezier(.34,1.56,.64,1) .12s}

.next{position:absolute;left:calc(50% - 30px);top:calc(100vh - 84px);top:calc(100svh - 84px - env(safe-area-inset-bottom));width:60px;height:60px;border:0;padding:0;border-radius:50%;
  background:#fff;cursor:pointer;display:grid;place-items:center;opacity:.7;transition:opacity .3s ease;
  animation:bob 1.6s ease-in-out infinite}
.next svg{width:36px;height:36px;display:block}
.next:focus-visible{outline:4px solid var(--primary);outline-offset:4px}
.next.is-off{opacity:0;pointer-events:none}
.next{z-index:8}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 8px}}

/* スマホの絵（縦長） */
.scene--sp{width:402px;height:874px}
.scene--sp .scene__bg{left:-160px;top:-82px;width:746px;height:1225px}
.scene--sp .scene__line path{stroke-width:16}
.scene--sp .caption{left:24px;top:612px;font-size:28px}
.is-sp .next{top:calc(100vh - 92px);top:calc(100svh - 92px - env(safe-area-inset-bottom))}

@media (prefers-reduced-motion:reduce){
  .top__start{transition:none}
  .is-shaking .hand__shake{animation:none}
  #dot{animation:none}
  .next{animation:none}
  .sweat{transform:none;transition:opacity .2s linear}
  .peek img{transition:transform .2s ease}
  .say{transform:translate(0,-50%)}
  .say.is-on{transition-delay:0s}
  .hero__logo,.hero__phone,.hero__dl,.hero__dog{transform:none!important}
  .hero__dog{opacity:0;transition:opacity .2s}
  .hero.is-dog .hero__dog{opacity:1}
}
</style>
</head>
<body>

<header class="top">
  <a class="top__logo" href="#story" aria-label="ページの先頭へ"><img src="../assets/logo.svg" alt="漢食" width="64" height="55"></a>
  <div class="top__right">
    <a class="top__start" href="../">はじめる</a>
    <button class="top__skip" id="skip" type="button">スキップする</button>
  </div>
</header>

<div class="probe" id="probe" aria-hidden="true"></div>

<main>
  <h1 class="sr-only">漢食 調べてくれるパートナーにあそんでごちそう</h1>

  <section class="story" id="story" aria-label="はじまり">
    <div class="story__stage" id="stage">
      <div class="scene" id="scene">
        <img class="scene__bg" id="bg" src="img/story/bg-pc.webp" alt="" width="1875" height="1460">
      </div>

      <div class="kraft" id="kraft" aria-hidden="true"></div>

      <div class="scene" id="scene2">
        <svg class="scene__line" id="lineSvg" aria-hidden="true">
          <g id="lineG"><path id="linePath" d="M 31.0464 0 C 31.0464 0 1.5975 18.413 0.0464 52.5 C -1.7135 91.1756 47.189 74.9561 43.5464 113.5 C 40.6925 143.699 13.7102 136.1888 12.5465 166.5 C 11.0522 205.4187 56.6899 217.0529 56.5465 256 C 56.4195 290.4589 30.5464 339.5 30.5464 339.5"/></g>
        </svg>

        <div class="hand" id="hand">
          <div class="hand__shake">
            <img class="hand__img" id="handImg" src="img/story/hand-pc.webp" alt="" width="1015" height="1309">
            <img class="sweat" id="sweat1" src="img/story/sweat.webp" alt="">
            <img class="sweat" id="sweat2" src="img/story/sweat.webp" alt="">
          </div>
        </div>

        <p class="caption caption--pc" id="cap1">「学校に書類<br>出さなきゃ！」</p>
        <p class="caption caption--pc" id="cap2"><span class="fade">「</span><span id="are"><span class="are-t">あれ</span><span class="ell"><span class="sr-only">…</span><i></i><i id="dot"></i><i></i></span><span class="are-t">？</span></span><br><span class="fade">「おんちゅう」って<br>どう書くんだっけ？」</span></p>

      </div>

      <div class="ghost" aria-hidden="true"></div>
      <div class="ghost" aria-hidden="true"></div>
      <div class="peek" id="peek">
        <p class="say" id="say">「御中だよ！」</p>
        <img src="../assets/character/dog-normal.webp" alt="" width="257" height="252">
      </div>

      <div class="hero" id="hero">
        <div class="hero__box" id="heroBox">
          <div class="hero__phone"><div class="hero__screen"><img src="img/room.webp" alt="漢食のお部屋の画面" width="780" height="1688"><span class="hero__island"></span></div></div>
          <img class="hero__dog" src="../assets/character/dog-normal.webp" alt="" width="257" height="252">
          <svg class="hero__wave" id="heroWave" viewBox="-3000 0 7300 3000" aria-hidden="true"><path id="heroWavePath" d=""/></svg>
          <img class="hero__logo" src="../assets/logo.svg" alt="漢食 KANSHOKU" width="650" height="560">
          <div class="hero__dl">
            <p class="hero__dl-label"><svg viewBox="0 0 12 28" aria-hidden="true"><path d="M2 2L10 26"/></svg>漢食をダウンロード！<svg viewBox="0 0 12 28" aria-hidden="true"><path d="M10 2L2 26"/></svg></p>
            <div class="hero__badges">
              <a href="../" aria-label="App Storeからダウンロード"><img src="img/hero/appstore-ja.svg" alt="App Storeからダウンロード" width="109" height="40"></a>
              <a href="../" aria-label="Google Playで手に入れよう"><img src="img/hero/googleplay-ja.png" alt="Google Playで手に入れよう" width="646" height="192"></a>
            </div>
          </div>
        </div>
      </div>

      <button class="next" id="next" type="button" aria-label="つづきを見る">
        <svg viewBox="0 0 36 36" aria-hidden="true"><path fill="#38aacf" transform="translate(9 6)" d="M7.939 23.56L.439 16.06A1.5 1.5 0 0 1 2.56 13.94L7.5 18.879V1.5a1.5 1.5 0 0 1 3 0v17.379l4.939-4.94a1.5 1.5 0 0 1 2.121 2.121l-7.5 7.5a1.5 1.5 0 0 1-2.121 0Z"/></svg>
      </button>
    </div>
  </section>
</main>

<script>
(() => {
  /* 絵の置き場所（Figmaの座標そのまま）
     tip  = 手の画像の中のペン先
     start= はじめの手の位置
     line = 線のパスを置く位置と倍率
     sweat= 手の画像の中の汗の位置と大きさ */
  const PC = {
    w: 1280, h: 832, bleed: 1582,
    bg: 'img/story/bg-pc.webp', hand: 'img/story/hand-pc.webp', handW: 1015, handH: 1309,
    tip: { x: 44, y: 321 },
    start: { x: 644, y: -74 },
    line: { x: 592.95, y: 282.5, k: 1 },
    sweat: [{ x: 558, y: 304, w: 97, h: 116 }, { x: 445, y: 420, w: 97, h: 116 }],
  };
  const SP = {
    w: 402, h: 874, bleed: 560,
    bg: 'img/story/bg-sp.webp', hand: 'img/story/hand-sp.webp', handW: 668, handH: 725,
    tip: { x: 42, y: 248 },
    start: { x: 140.54, y: 20.72 },
    line: { x: 184, y: 330, k: 0.6 },
    sweat: [{ x: 190, y: 192, w: 44, h: 52 }, { x: 136, y: 116, w: 40, h: 48 }],
  };

  // ヒーローの大きさと青い波の形（ヒーローの座標）
  const HERO = {
    pc: { w: 1280, h: 832, wave: 'M -3000 610 L -200 610 C 0 610 120 548 300 548 C 520 548 600 640 820 640 C 1020 640 1100 520 1300 520 C 1500 520 1600 560 4300 560 L 4300 3000 L -3000 3000 Z' },
    sp: { w: 390, h: 844, wave: 'M -3000 700 L 0 700 C 90 700 150 722 230 704 C 300 688 330 630 420 630 L 4300 630 L 4300 3000 L -3000 3000 Z' },
  };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const probe = $('probe');
  const viewH = () => probe.offsetHeight || innerHeight;   // バーが出ているときの画面の高さ
  const story = $('story'), stage = $('stage'), scene = $('scene'), scene2 = $('scene2');
  const scenes = [scene, scene2];   // 奥（封筒の絵）と手前（線・手・字）を同じように動かす
  const bg = $('bg'), hand = $('hand'), handImg = $('handImg');
  const lineSvg = $('lineSvg'), lineG = $('lineG'), path = $('linePath');
  const sweats = [$('sweat1'), $('sweat2')];
  const cap1 = $('cap1'), cap2 = $('cap2'), next = $('next'), are = $('are');
  const fades = [...cap2.querySelectorAll('.fade')];
  const kraft = $('kraft'), dot = $('dot'), peek = $('peek'), say = $('say');
  const others = [...are.querySelectorAll('.are-t, .ell i:not(#dot)')];
  const sideDots = [...are.querySelectorAll('.ell i:not(#dot)')];
  const ghosts = [...document.querySelectorAll('.ghost')];   // 左右の丸を画面の大きさで描いたもの
  const hero = $('hero'), heroBox = $('heroBox'), heroWavePath = $('heroWavePath');
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;

  let cfg = null;
  let base = { x: 0, y: 0, s: 1 };   // 画面に合わせたときの位置と倍率

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const span = (p, a, b) => clamp((p - a) / (b - a));
  const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  function setCfg(c) {
    if (cfg === c) return;
    cfg = c;
    scenes.forEach((el) => el.classList.toggle('scene--sp', c === SP));
    stage.classList.toggle('is-sp', c === SP);
    bg.src = c.bg;
    handImg.src = c.hand; handImg.width = c.handW; handImg.height = c.handH;
    handImg.style.width = c.handW + 'px'; handImg.style.height = c.handH + 'px';
    c.sweat.forEach((s, i) => Object.assign(sweats[i].style, { left: s.x + 'px', top: s.y + 'px', width: s.w + 'px', height: s.h + 'px' }));
    const k = c.line.k;
    Object.assign(lineSvg.style, { left: c.line.x + 'px', top: c.line.y + 'px' });
    lineSvg.setAttribute('width', 57 * k); lineSvg.setAttribute('height', 340 * k);
    lineG.setAttribute('transform', `scale(${k})`);
    heroWavePath.setAttribute('d', (c === SP ? HERO.sp : HERO.pc).wave);
    path.style.strokeWidth = 16;
  }

  function fit() {
    const vw = stage.clientWidth, vh = viewH();
    setCfg(vw / vh < 0.85 ? SP : PC);
    let s = vh / cfg.h;
    if (vw / s > cfg.bleed) s = vw / cfg.bleed;          // 横に広すぎる画面は幅に合わせる
    const x = (vw - cfg.w * s) / 2;
    const y = (vh - cfg.h * s) * 0.3;                     // はみ出すときは上を多めに残す
    base = { x, y, s };
    M = null;
    update();
  }

  // 線の上の点（シーンの座標）
  function pointAt(t) {
    const p = path.getPointAtLength(len * t), k = cfg.line.k;
    return { x: cfg.line.x + p.x * k, y: cfg.line.y + p.y * k };
  }

  function scrolled() {
    const total = story.offsetHeight - stage.clientHeight;
    return clamp(-story.getBoundingClientRect().top, 0, Math.max(0, total));
  }
  function progress() {
    const total = story.offsetHeight - stage.clientHeight;
    return total > 0 ? scrolled() / total : 0;
  }

  // 「あれ…？」と真ん中の丸の位置と大きさ（シーンの座標）を測っておく
  let M = null;
  let nextBlocked = false;
  function measure() {
    const keep = scene2.style.transform;
    scene2.style.transform = 'none';
    const o = scene2.getBoundingClientRect();
    const a = are.getBoundingClientRect(), d = dot.getBoundingClientRect();
    const sides = sideDots.map((el) => { const b = el.getBoundingClientRect(); return { x: b.left - o.left + b.width / 2, y: b.top - o.top + b.height / 2 }; });
    scene2.style.transform = keep;
    M = {
      are: { x: a.left - o.left + a.width / 2, y: a.top - o.top + a.height / 2, w: a.width, h: a.height },
      // 真ん中の丸は跳ねていることがあるので 左右の丸のまんなかを使う
      dot: { x: (sides[0].x + sides[1].x) / 2, y: (sides[0].y + sides[1].y) / 2, d: d.width },
      sides,
    };
  }

  /* 進み方（画面いくつ分スクロールしたか）
     0〜3.1   はじまり→ペンが動く→手が震えて汗が出る
     3.4〜4.7 「あれ…？」に寄っていく まわりの字とうねうねはじわじわ消える
     4.7〜5.3 「あれ…？」が画面いっぱい 真ん中の丸がぴょんぴょん跳ねる
     5.3〜6.8 「…」の真ん中の丸に寄っていく 丸はだんだん白くなる ほかの字は消える
     7.0〜7.45 丸の中からいぬが顔を出して「御中だよ！」 そのあと台詞はポンと消えて いぬもポンと下がる
     7.7〜8.7 白い丸が広がってヒーローになる 中身がポンと出て 広がりきったらいぬが波の後ろから出てくる */
  const INK = [0x47, 0x43, 0x38];

  function update() {
    const vw = stage.clientWidth, vh = viewH();
    const u = scrolled() / vh;                                 // 画面いくつ分スクロールしたか
    const p = clamp(u / 3.1);
    const begin = pointAt(0);
    const startTip = { x: cfg.start.x + cfg.tip.x, y: cfg.start.y + cfg.tip.y };

    // 1 ペンを紙に下ろす → 2 線をなぞる
    const t1 = ease(span(p, 0.08, 0.2));
    const t2 = span(p, 0.2, 0.64);
    let tip;
    if (t2 <= 0) tip = { x: startTip.x + (begin.x - startTip.x) * t1, y: startTip.y + (begin.y - startTip.y) * t1 };
    else tip = pointAt(t2);
    hand.style.transform = `translate(${tip.x - cfg.tip.x}px,${tip.y - cfg.tip.y}px)`;
    path.style.strokeDashoffset = len * (1 - t2);
    path.style.opacity = t2 > 0 ? 1 - span(u, 3.5, 4.3) : 0;   // 寄っていくときは線も消える

    // ことば
    cap1.style.opacity = 1 - span(p, 0.06, 0.16);
    cap2.style.opacity = span(p, 0.66, 0.74);

    // 3 手が震えて 汗がひとつずつ出る
    scene2.classList.toggle('is-shaking', p >= 0.66 && u < 4.8);
    sweats[0].classList.toggle('is-on', p >= 0.74);
    sweats[1].classList.toggle('is-on', p >= 0.86);

    // 4 「あれ…？」に寄る
    if (!M) measure();
    const z1 = ease(span(u, 3.4, 4.7));
    fades.forEach((el) => { el.style.opacity = 1 - span(u, 3.5, 4.3); });   // まわりの字
    const F1 = M.are;
    const S1 = Math.max(base.s, Math.min(vw * (cfg === SP ? 0.7 : 0.56) / F1.w, vh * 0.3 / F1.h));

    // 5 真ん中の丸に寄る
    const z2 = ease(span(u, 5.3, 6.8));
    dot.style.setProperty('--hop', reduce ? 0 : span(u, 4.55, 4.75) * (1 - span(u, 5.3, 5.45)));   // 跳ねる高さ（寄り始めたら小さくなって止まる）
    const D0 = Math.min(vw * 0.6, vh * 0.36);               // でっかくなった丸の大きさ（まわりに余白を残す）
    const D = cfg === PC ? Math.min(D0 * 3, vh * 0.92) : D0; // パソコンは3倍（画面の高さからははみ出さない）
    const S2 = Math.max(S1, D / M.dot.d);
    others.forEach((el) => { el.style.opacity = 1 - span(u, 5.4, 6.3); });
    const wt = ease(span(u, 5.9, 6.7));
    const dotColor = `rgb(${INK.map((c) => Math.round(c + (255 - c) * wt)).join(',')})`;
    dot.style.background = dotColor;

    let S, tx, ty;
    if (z2 <= 0) {
      S = base.s + (S1 - base.s) * z1;
      const fx = base.x + base.s * F1.x, fy = base.y + base.s * F1.y;
      const px = fx + (vw / 2 - fx) * z1, py = fy + (vh / 2 - fy) * z1;
      tx = px - S * F1.x; ty = py - S * F1.y;
    } else {
      S = S1 * Math.pow(S2 / S1, z2);
      const w = 1 - (1 - z2) * S1 / S;                       // 丸が画面のまんなかへまっすぐ近づくように
      const fx = F1.x + (M.dot.x - F1.x) * w, fy = F1.y + (M.dot.y - F1.y) * w;
      tx = vw / 2 - S * fx; ty = vh / 2 - S * fy;
    }
    scenes.forEach((el) => { el.style.transform = `translate(${tx}px,${ty}px) scale(${S})`; });

    // 寄るにつれて画面いっぱいを封筒の紙にする（紙のふちと白い机を消す）
    kraft.style.opacity = span(u, 3.5, 4.5);
    const deep = u > 4.8;                                     // 大きく寄ったら見えない絵は描かない
    // ページの外側（引っぱりすぎたときに見える所）も紙の色にそろえる
    document.documentElement.style.background = document.body.style.background = u > 4.5 ? 'rgb(209,169,115)' : '';
    bg.style.visibility = hand.style.visibility = lineSvg.style.visibility = deep ? 'hidden' : '';

    // 6 丸が大きくなったら画面の大きさで描いた丸に入れかえる（拡大しすぎると丸がゆがむため）
    const r = M.dot.d * S;
    const swap = z2 > 0 && r > 24;
    if (swap) {
      const cx = tx + S * M.dot.x, cy = ty + S * M.dot.y;
      Object.assign(peek.style, { left: cx - r / 2 + 'px', top: cy - r / 2 + 'px', width: r + 'px', height: r + 'px', background: dotColor });
      say.style.fontSize = Math.max(20, Math.round(r * 0.1 / 4) * 4) + 'px';   // 丸の大きさに合わせる
    }
    dot.style.visibility = swap ? 'hidden' : '';
    // 左右の丸も同じように入れかえる（拡大しすぎると四角っぽくゆがむため）
    const sideOp = 1 - span(u, 5.4, 6.3);
    ghosts.forEach((g, i) => {
      const show = swap && sideOp > 0;
      g.classList.toggle('is-on', show);
      sideDots[i].style.visibility = swap ? 'hidden' : '';
      if (!show) return;
      const c = M.sides[i];
      Object.assign(g.style, { left: tx + S * c.x - r / 2 + 'px', top: ty + S * c.y - r / 2 + 'px', width: r + 'px', height: r + 'px', opacity: sideOp });
    });
    // 下向きボタンが丸に重なるときは出さない
    const nb = next.getBoundingClientRect(), sb = stage.getBoundingClientRect();
    const E = span(u, 7.7, 8.7);                               // 丸が広がってヒーローになる進み具合
    nextBlocked = swap && E <= 0 && (ty + S * M.dot.y + r / 2) > (nb.top - sb.top) - 8;
    if (nextBlocked) setNext(false);

    // 7 丸の中からいぬが顔を出して「御中だよ！」
    const up = z2 >= 1 && u >= 7.0;
    const talk = up && u < 7.45;                             // 7.45で「御中だよ！」がポンと消えて いぬもポンと下がる
    skip.classList.toggle('is-off', up);                     // 最後まで来たらスキップは消す
    if (talk && !peek.classList.contains('is-on')) { peek.classList.add('is-on'); void peek.offsetWidth; }
    peek.classList.toggle('is-on', swap && E <= 0);
    peek.classList.toggle('is-up', talk);
    say.classList.toggle('is-on', talk);

    // 8 白い丸が広がってヒーローになる（はじめに少し縮んでからポンと広がる）
    hero.classList.toggle('is-on', E > 0);
    if (E > 0) {
      const sh = stage.clientHeight;
      const cx = tx + S * M.dot.x, cy = ty + S * M.dot.y;
      const r0 = M.dot.d * S / 2;
      const R = Math.hypot(Math.max(cx, vw - cx), Math.max(cy, sh - cy)) + 8;
      const c1 = 1.70158, c3 = c1 + 1;
      const k = c3 * E * E * E - c1 * E * E;                  // 少し引いてから一気に広がる
      const rad = Math.max(0, r0 + (R - r0) * k);
      hero.style.clipPath = E >= 1 ? 'none' : `circle(${rad}px at ${cx}px ${cy}px)`;
      // ヒーローの中身は画面に収まるように縮める
      const HB = cfg === SP ? HERO.sp : HERO.pc;
      const hs = Math.min(vw / HB.w, vh / HB.h);
      heroBox.style.transform = `translate(${(vw - HB.w * hs) / 2}px,${(vh - HB.h * hs) / 2}px) scale(${hs})`;
    }
    hero.classList.toggle('is-in', E >= 0.45);
    hero.classList.toggle('is-dog', E >= 1);
    if (E > 0) document.documentElement.style.background = document.body.style.background = 'rgb(56,170,207)';
  }

  // 下向きボタン：スクロールが3秒止まったらまた出す（いちばん下では出さない）
  const IDLE_MS = 3000;
  let idleTimer = 0;
  const setNext = (on) => next.classList.toggle('is-off', !on);
  // スキップ：はじまりの場面をとばして最後（いぬの場面）まで進む
  const skip = $('skip');
  skip.addEventListener('click', () => {
    const total = story.offsetHeight - stage.clientHeight;
    scrollTo({ top: story.offsetTop + total, behavior: 'auto' });
  });
  next.addEventListener('click', () => {
    scrollBy({ top: innerHeight, behavior: reduce ? 'auto' : 'smooth' });
  });

  let ticking = false;
  addEventListener('scroll', () => {
    setNext(progress() <= 0.02);
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (progress() < 0.995 && !nextBlocked) setNext(true); }, IDLE_MS);
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; update(); });
  }, { passive: true });
  addEventListener('resize', fit);
  if (document.fonts) document.fonts.ready.then(() => { M = null; update(); });
  fit();
})();
</script>
</body>
</html>
